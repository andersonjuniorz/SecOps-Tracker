spring.application.name=SecOps-Tracker

# =========================================================================
# MySQL
# ==========================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/secopstracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.show-sql=true